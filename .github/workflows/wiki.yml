name: Synk wiki

# Kopierer wiki/-mappen til GitHubs Wiki-fane hver gang den endres på main
on:
  push:
    branches: [main]
    paths: ["wiki/**", "tools/synk-wiki.py", ".github/workflows/wiki.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hent wikien
        run: git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki-ut
      - name: Kopier sidene
        run: python3 tools/synk-wiki.py wiki-ut
      - name: Lagre og last opp
        working-directory: wiki-ut
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Ingen endringer"; exit 0; fi
          git commit -m "Synk wiki fra ${GITHUB_SHA::7}"
          git push
